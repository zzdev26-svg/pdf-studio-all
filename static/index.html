<title>PDF a Markdown para agentes</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9702844972960784" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #18181b;
    --muted: #71717a;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-soft: #eef2ff;
    --error: #dc2626;
    --success: #059669;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem 3rem;
  }

  header { text-align: center; margin-bottom: 2.5rem; max-width: 560px; }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    margin-bottom: 1rem;
  }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.2;
    margin: 0 0 0.6rem;
    letter-spacing: -0.02em;
  }
  p.subtitle { color: var(--muted); margin: 0; font-size: 1.05rem; line-height: 1.5; }

  .wrap { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 1.5rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }

  .dropzone {
    display: block;
    border: 2px dashed var(--border-strong);
    border-radius: 16px;
    padding: 3rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    background: var(--surface);
  }
  .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone input { display: none; }
  .dropzone-icon {
    width: 40px; height: 40px; margin: 0 auto 1rem;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); border-radius: 10px; color: var(--accent);
  }
  .dropzone-text { font-weight: 500; font-size: 0.98rem; }
  .dropzone-text strong { color: var(--accent); }
  .dropzone-hint { color: var(--muted); font-size: 0.85rem; margin-top: 0.3rem; }
  .file-info { color: var(--text); font-weight: 500; font-size: 0.9rem; margin-top: 0.75rem; }

  .actions-row { display: flex; align-items: center; gap: 1rem; }

  button.primary {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0.75rem 1.4rem;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }

  button.secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 0.45rem 0.9rem;
    font-size: 0.85rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  button.secondary:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  .result-header strong { font-size: 0.95rem; }
  .actions { display: flex; gap: 0.5rem; }

  textarea {
    display: block;
    width: 100%;
    height: 420px;
    background: var(--surface);
    color: var(--text);
    border: none;
    border-radius: 0 0 16px 16px;
    padding: 1.25rem;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.85rem;
    line-height: 1.6;
    resize: vertical;
  }
  textarea:focus { outline: none; }

  .status { font-size: 0.9rem; color: var(--muted); min-height: 1.2em; padding-left: 0.1rem; }
  .status.error { color: var(--error); }
  .status.success { color: var(--success); }

  footer { color: var(--muted); font-size: 0.8rem; margin-top: 3rem; text-align: center; }

  .hidden { display: none; }

  .ad-slot { width: 100%; text-align: center; margin: 0.5rem 0; min-height: 1px; }
</style>

<header>
  <span class="eyebrow">Para agentes de IA</span>
  <h1>PDF a Markdown para agentes</h1>
  <p class="subtitle">Subí un PDF y obtené el Markdown limpio y estructurado, listo para que lo interprete un agente de IA.</p>
</header>

<!-- Ad unit deshabilitada hasta tener el data-ad-slot real (creado en AdSense tras la aprobación).
<ins class="adsbygoogle ad-slot"
     style="display:block"
     data-ad-client="ca-pub-9702844972960784"
     data-ad-slot="REPLACE_HEADER_SLOT_ID"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
-->


<div class="wrap">
  <label class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept="application/pdf" />
    <div class="dropzone-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <div class="dropzone-text" id="dropzoneText"><strong>Hacé click para elegir un PDF</strong> o arrastralo acá</div>
    <div class="dropzone-hint">Máximo 25 MB</div>
    <div class="file-info" id="fileInfo"></div>
  </label>

  <div class="actions-row">
    <button class="primary" id="convertBtn" disabled>Convertir a Markdown</button>
    <div class="status" id="status"></div>
  </div>

  <div id="resultSection" class="hidden card" style="overflow: hidden;">
    <div class="result-header">
      <strong>Resultado</strong>
      <div class="actions">
        <button class="secondary" id="copyBtn">Copiar</button>
        <button class="secondary" id="downloadBtn">Descargar .md</button>
      </div>
    </div>
    <textarea id="output" readonly spellcheck="false"></textarea>
  </div>

  <!-- Ad unit deshabilitada hasta tener el data-ad-slot real (creado en AdSense tras la aprobación).
  <ins id="resultAd" class="adsbygoogle ad-slot hidden"
       style="display:block"
       data-ad-client="ca-pub-9702844972960784"
       data-ad-slot="REPLACE_RESULT_SLOT_ID"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  -->
</div>

<footer>PDF Studio · procesamiento local, sin persistencia de archivos</footer>

<script>
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");
  const dropzoneText = document.getElementById("dropzoneText");
  const fileInfo = document.getElementById("fileInfo");
  const convertBtn = document.getElementById("convertBtn");
  const statusEl = document.getElementById("status");
  const resultSection = document.getElementById("resultSection");
  const output = document.getElementById("output");
  const copyBtn = document.getElementById("copyBtn");
  const downloadBtn = document.getElementById("downloadBtn");

  let selectedFile = null;
  let lastFilename = "output.md";

  function setFile(file) {
    if (!file) return;
    if (file.type !== "application/pdf") {
      setStatus("El archivo debe ser un PDF.", true);
      return;
    }
    selectedFile = file;
    dropzoneText.innerHTML = "<strong>Archivo listo</strong> — hacé click para cambiarlo";
    fileInfo.textContent = `${file.name} (${(file.size / 1024).toFixed(0)} KB)`;
    convertBtn.disabled = false;
    setStatus("");
  }

  function setStatus(msg, isError = false, isSuccess = false) {
    statusEl.textContent = msg;
    statusEl.classList.toggle("error", isError);
    statusEl.classList.toggle("success", isSuccess);
  }

  dropzone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (e) => setFile(e.target.files[0]));

  ["dragenter", "dragover"].forEach((evt) =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add("drag");
    })
  );
  ["dragleave", "drop"].forEach((evt) =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove("drag");
    })
  );
  dropzone.addEventListener("drop", (e) => setFile(e.dataTransfer.files[0]));

  convertBtn.addEventListener("click", async () => {
    if (!selectedFile) return;
    convertBtn.disabled = true;
    setStatus("Convirtiendo...");
    resultSection.classList.add("hidden");

    const formData = new FormData();
    formData.append("file", selectedFile);

    try {
      const res = await fetch("/api/convert", { method: "POST", body: formData });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Error al convertir el PDF.");

      output.value = data.markdown;
      lastFilename = (data.filename || "output").replace(/\.pdf$/i, "") + ".md";
      resultSection.classList.remove("hidden");
      setStatus(`Listo. ${data.markdown.length} caracteres generados.`, false, true);
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      convertBtn.disabled = false;
    }
  });

  copyBtn.addEventListener("click", async () => {
    await navigator.clipboard.writeText(output.value);
    setStatus("Copiado al portapapeles.");
  });

  downloadBtn.addEventListener("click", () => {
    const blob = new Blob([output.value], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = lastFilename;
    a.click();
    URL.revokeObjectURL(url);
  });
</script>
